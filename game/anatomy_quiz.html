<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>해부 구조물 맞추기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F4F4F6; --surface:#FFFFFF; --sunk:#EAEAEF; --line:#D8D8E0;
  --text:#191922; --text-2:#5A5A68; --accent:#2F5D8C; --ok:#2E7D4F; --bad:#B03A48;
  --sans:'Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131319; --surface:#1A1A22; --sunk:#22222B; --line:#2E2E3A;
  --text:#E5E5EC; --text-2:#9E9EAE; --accent:#7FAEDC; --ok:#6FCB94; --bad:#E5808E;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);min-height:100vh}
.app{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:700;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:12px}
.grp{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:10px}
.grp button{border:0;background:none;color:var(--text-2);font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;cursor:pointer}
.grp button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:700;box-shadow:0 1px 2px #0003}
.main{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:16px;align-items:start}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.stage svg{display:block;width:100%;height:auto;max-height:78vh}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:300px}
.stat{display:flex;gap:16px;font-size:13px;color:var(--text-2);margin-bottom:12px}
.q{font-size:18px;font-weight:700;margin-bottom:12px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices button,.btn{border:1px solid var(--line);background:var(--sunk);color:var(--text);font:inherit;padding:12px;border-radius:10px;cursor:pointer;text-align:center}
.choices button:hover:not(:disabled),.btn:hover{border-color:var(--accent)}
.choices button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.choices button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.card{margin-top:14px;padding:12px;border-radius:10px;background:var(--sunk);font-size:14px}
.card b{font-size:16px}.card .en{color:var(--text-2);font-style:italic}
.fb{margin-top:12px;font-weight:700}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.miss li{margin-left:20px}
.hint{color:var(--text-2);font-size:14px}
/* svg states */
.st{cursor:pointer;transition:opacity .15s}
svg.quiz .st{opacity:.16}
svg.quiz .st.hl{opacity:1;filter:drop-shadow(0 0 3px #f5c542) drop-shadow(0 0 7px #f5c542)}
svg.study .st:hover{filter:drop-shadow(0 0 4px #f5c542)}
.st.good{filter:drop-shadow(0 0 5px #3cc47c)!important;opacity:1!important}
.st.wrong{filter:drop-shadow(0 0 5px #e5484d)!important;opacity:1!important}
@media (max-width:720px){.main{grid-template-columns:1fr}.stage svg{max-height:56vh}}
</style>
</head>
<body>
<div class="app">
  <h1>해부 구조물 맞추기</h1>
  <div class="bar">
    <div class="grp" id="modes" role="group" aria-label="모드"></div>
    <div class="grp" id="layers" role="group" aria-label="층"></div>
  </div>
  <div class="main">
    <div class="stage"><div id="stage"></div></div>
    <div class="panel" id="panel"></div>
  </div>

/* ───────── SVG 생성 (다운로드와 화면이 같은 문자열 사용) ───────── */
function bodyMarkup(){
  const sil='fill="#9aa0b4" fill-opacity=".16" stroke="#9aa0b4" stroke-opacity=".5" stroke-width="1.5"';
  const lim=d=>`<path d="${d}" fill="none" stroke="#9aa0b4" stroke-opacity=".16" stroke-width="CW" stroke-linecap="round"/>`;
  const both=(x)=>x+`<g transform="translate(400 0) scale(-1 1)">${x}</g>`;
  let out='<g id="silhouette" pointer-events="none">'
   +`<ellipse cx="200" cy="58" rx="36" ry="44" ${sil}/><rect x="186" y="96" width="28" height="44" ${sil}/>`
   +`<path d="M144 140 Q200 125 256 140 L268 250 Q266 330 252 440 L148 440 Q134 330 132 250 Z" ${sil}/>`
   +both(lim('M126 152 L98 290 L74 420').replace('CW','32')+lim('M172 442 L162 640 L160 850').replace('CW','54'))
   +'</g>';
  for(const L of ORDER){
    out+=`<g class="ly" data-layer="${L}">`;
    for(const o of S.filter(o=>o.layer===L)){
      const one=o.svg.replaceAll('{c}',o.c).replaceAll('{s}',o.s);
      out+=`<g class="st" data-id="${o.id}">${one}`+(o.mirror?`<g transform="translate(400 0) scale(-1 1)">${one}</g>`:'')+'</g>';
    }
    out+='</g>';
  }
  return out;
}
const svgOpen='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" role="img" aria-label="인체 앞모습">';
function downloadSvg(){
  const blob=new Blob([svgOpen+bodyMarkup()+'</svg>'],{type:'image/svg+xml'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='body_front.svg';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ───────── 상태 ───────── */
const $=s=>document.querySelector(s);
const st={mode:'study',layer:'bone',q:[],i:0,score:0,streak:0,best:0,miss:[],locked:false,cur:null};
const MODES={study:'공부',name:'이름 맞추기',find:'위치 찾기'};
const LAYER_BTNS={bone:'뼈',muscle:'근육',organ:'장기',all:'전체'};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pool=()=>S.filter(o=>st.layer==='all'||o.layer===st.layer);
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const load=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

function buildStage(){
  $('#stage').innerHTML=svgOpen+bodyMarkup()+'</svg>';
  $('#stage').firstChild.addEventListener('click',e=>{const g=e.target.closest('.st');if(g&&g.closest('.ly').style.display!=='none')onTap(g.dataset.id,g);});
}
function applyLayer(){
  document.querySelectorAll('.ly').forEach(l=>{
    l.style.display=(st.layer==='all'||l.dataset.layer===st.layer)?'':'none';
    l.style.opacity=(st.layer==='all'&&l.dataset.layer==='muscle')?'.55':'';
  });
}
function clearMarks(){document.querySelectorAll('.st').forEach(g=>g.classList.remove('hl','good','wrong'));}
const gs=id=>document.querySelectorAll(`.st[data-id="${id}"]`);

function renderBar(){
  const mk=(el,map,key)=>{el.innerHTML=Object.entries(map).map(([k,v])=>`<button aria-pressed="${st[key]===k}" data-k="${k}">${v}</button>`).join('');};
  mk($('#modes'),MODES,'mode');mk($('#layers'),LAYER_BTNS,'layer');
}
$('#modes').onclick=e=>{const k=e.target.dataset.k;if(k){st.mode=k;start();}};
$('#layers').onclick=e=>{const k=e.target.dataset.k;if(k){st.layer=k;start();}};

function start(){
  renderBar();applyLayer();clearMarks();
  const svg=$('#stage').firstChild;
  svg.classList.toggle('quiz',st.mode==='name');
  svg.classList.toggle('study',st.mode!=='name');
  st.best=+load('anatomyBest:'+st.mode+':'+st.layer)||0;
  if(st.mode==='study'){renderStudy(null);return;}
  newRound(shuffle(pool()).slice(0,10));
}
function newRound(items){
  Object.assign(st,{q:items,i:0,score:0,streak:0,miss:[],locked:false});
  ask();
}

/* ───────── 공부 ───────── */
function renderStudy(o){
  clearMarks();
  if(o)gs(o.id).forEach(g=>g.classList.add('hl'));
  $('#panel').innerHTML=o
   ?`<div class="card"><b>${o.ko}</b> <span class="en">${o.en}</span><br><span class="hint">${LAYERS[o.layer]}</span><p style="margin-top:6px">${o.note}</p></div>`
   :'<p class="hint">그림에서 구조물을 눌러 이름과 설명을 확인하세요.<br>위의 <b>층</b> 버튼으로 뼈 · 근육 · 장기를 바꿀 수 있고, 외운 뒤에는 <b>이름 맞추기</b>와 <b>위치 찾기</b>로 시험해 보세요.</p><div class="actions"><button class="btn" id="dl">SVG 저장 (Figma · Inkscape용)</button></div>';
  const dl=$('#dl');if(dl)dl.onclick=downloadSvg;
}

/* ───────── 퀴즈 공통 ───────── */
function head(){
  return `<div class="stat"><span>${st.i+1} / ${st.q.length}</span><span>점수 ${st.score}</span><span>연속 ${st.streak}</span><span>최고 ${st.best}</span></div>`;
}
function ask(){
  if(st.i>=st.q.length)return finish();
  st.locked=false;clearMarks();
  const o=st.cur=st.q[st.i];
  if(st.mode==='name'){
    gs(o.id).forEach(g=>g.classList.add('hl'));
    const opts=shuffle([o,...shuffle(pool().filter(x=>x.id!==o.id)).slice(0,3)]);
    $('#panel').innerHTML=head()+'<div class="q">노란색으로 표시된 구조물은?</div><div class="choices">'
      +opts.map(x=>`<button data-id="${x.id}">${x.ko}</button>`).join('')+'</div><div id="fb"></div>';
    $('#panel').querySelector('.choices').onclick=e=>{const id=e.target.dataset.id;if(id)answer(id,e.target);};
  }else{
    $('#panel').innerHTML=head()+`<div class="q">‘${o.ko}’을(를) 찾아 누르세요</div><div id="fb"></div>`;
  }
}
function onTap(id,g){
  if(st.mode==='study'){renderStudy(BYID[id]);return;}
  if(st.mode==='find'&&!st.locked)answer(id,g);
}
function answer(id,el){
  if(st.locked)return;st.locked=true;
  const o=st.cur,ok=id===o.id;
  if(ok){st.score++;st.streak++;if(st.score>st.best){st.best=st.score;save('anatomyBest:'+st.mode+':'+st.layer,st.best);}}
  else{st.streak=0;st.miss.push(o);}
  if(st.mode==='name'){
    document.querySelectorAll('.choices button').forEach(b=>{b.disabled=true;if(b.dataset.id===o.id)b.classList.add('ok');});
    if(!ok)el.classList.add('bad');
  }else{
    clearMarks();
    if(!ok)gs(id).forEach(g=>g.classList.add('wrong'));
    gs(o.id).forEach(g=>g.classList.add('good'));
  }
  const picked=BYID[id];
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'정답!':`오답 — ${st.mode==='find'?`그곳은 ${picked.ko}입니다. `:''}정답은 ${o.ko}`}</div>
   <div class="card"><b>${o.ko}</b> <span class="en">${o.en}</span><p style="margin-top:6px">${o.note}</p></div>
   <div class="actions"><button class="btn primary" id="next">${st.i+1>=st.q.length?'결과 보기':'다음'}</button></div>`;
  $('#next').onclick=()=>{st.i++;ask();};
  $('#next').focus();
}
function finish(){
  clearMarks();
  $('#panel').innerHTML=`<div class="q">결과: ${st.score} / ${st.q.length}</div>`
   +(st.miss.length?`<p class="hint">틀린 구조물</p><ul class="miss">${st.miss.map(o=>`<li>${o.ko} <span class="hint">${o.en}</span></li>`).join('')}</ul>`:'<p class="fb ok">모두 맞혔어요!</p>')
   +'<div class="actions">'+(st.miss.length?'<button class="btn primary" id="retry">틀린 것만 다시</button>':'')+'<button class="btn" id="again">새 라운드</button></div>';
  const r=$('#retry');if(r)r.onclick=()=>newRound(shuffle(st.miss));
  $('#again').onclick=start;
}

buildStage();start();
</script>
</body>
</html>
