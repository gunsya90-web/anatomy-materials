<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>몸통 조립 뷰어 (가슴·배·골반)</title>
<style>
:root{--bg:#F4F4F6;--surface:#fff;--sunk:#EAEAEF;--line:#D8D8E0;--text:#191922;--text-2:#5A5A68;--accent:#2F6FD0;--stage:#F7F3EE}
@media (prefers-color-scheme:dark){:root{--bg:#131319;--surface:#1A1A22;--sunk:#22222B;--line:#2E2E3A;--text:#E5E5EC;--text-2:#9E9EAE;--accent:#7FAEDC;--stage:#262330}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 'Noto Sans KR',system-ui,sans-serif}
.app{max-width:1040px;margin:0 auto;padding:16px}
h1{font-size:19px;margin-bottom:10px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:14px;padding:6px}
svg{display:block;width:100%;height:auto;max-height:82vh}
.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px}
.side h2{font-size:12px;color:var(--text-2);font-weight:500;margin:10px 0 4px}
.side h2:first-child{margin-top:0}
.item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:7px;cursor:pointer}
.item:hover{background:var(--sunk)}.item.on{background:var(--accent);color:#fff}
.item input{accent-color:var(--accent)}
.card{margin-top:12px;padding:10px;border-radius:10px;background:var(--sunk)}
.card b{font-size:16px}.card i{color:var(--text-2)}
label.opt{display:flex;gap:6px;align-items:center;margin-top:10px;color:var(--text-2)}
/* 선택 상태: 부품 단위로 색을 바꾼다 */
.part{cursor:pointer}
.part.on .f{fill:url(#hl)!important}
.part.on .ps{stroke:#4E9CEE!important}
.part.on{filter:drop-shadow(0 0 5px #3D93EA)}
.dimmer .part:not(.on){opacity:.25}
.part:hover:not(.on){filter:brightness(1.08)}
.part.hide{display:none}
@media(max-width:760px){.main{grid-template-columns:1fr}}
</style></head><body><div class="app">

00 118 C170 112 146 130 138 160" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class=""/><g transform="translate(680 0) scale(-1 1)"><path class="f" d="M214 112 C176 96 142 112 130 150 C124 184 134 214 148 244 C168 214 190 182 204 156 C212 136 214 124 214 112 Z" fill="url(#mus2)" stroke="#5E1B1A" stroke-width="1.4" stroke-linejoin="round" filter="url(#sh)"/><g clip-path="url(#c-deltoid)" fill="none" stroke="#5E1B1A" stroke-opacity="0.42" stroke-width="1.1" stroke-linecap="round"><path d="M148 244 Q189.0 177.0 214.0 110.0"/><path d="M148 244 Q184.9 179.0 205.8 114.0"/><path d="M148 244 Q180.8 181.0 197.6 118.0"/><path d="M148 244 Q176.7 183.0 189.4 122.0"/><path d="M148 244 Q172.6 185.0 181.2 126.0"/><path d="M148 244 Q168.5 187.0 173.0 130.0"/><path d="M148 244 Q164.4 189.0 164.8 134.0"/><path d="M148 244 Q160.3 191.0 156.6 138.0"/><path d="M148 244 Q156.2 193.0 148.39999999999998 142.0"/><path d="M148 244 Q152.1 195.0 140.2 146.0"/><path d="M148 244 Q148.0 197.0 132.0 150.0"/></g><path d="M200 118 C170 112 146 130 138 160" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></svg></div><div class="side" id="side"></div></div></div>
<script>
const META=[{"id": "spine", "ko": "척주", "en": "Vertebral column", "layer": "bone", "note": "목뼈 7 · 등뼈 12 · 허리뼈 5 · 엉치뼈 · 꼬리뼈. 등뼈에는 갈비뼈가 붙습니다."}, {"id": "kidney", "ko": "콩팥", "en": "Kidney", "layer": "organ", "note": "복막뒤 장기. 오른쪽이 간 때문에 약간 더 낮습니다. 안쪽 오목한 곳이 콩팥문입니다."}, {"id": "adrenal", "ko": "콩팥위샘", "en": "Adrenal gland", "layer": "organ", "note": "콩팥 위쪽에 놓이는 내분비샘. 겉질과 속질로 나뉩니다."}, {"id": "ureter", "ko": "요관", "en": "Ureter", "layer": "organ", "note": "콩팥깔때기에서 방광으로 오줌을 내려보내는 근육관. 세 곳의 좁은 부위가 있습니다."}, {"id": "spleen", "ko": "지라", "en": "Spleen", "layer": "organ", "note": "왼쪽 윗배, 9–11번 갈비뼈 높이. 면역과 낡은 적혈구 제거를 담당합니다."}, {"id": "pancreas", "ko": "이자", "en": "Pancreas", "layer": "organ", "note": "복막뒤 장기. 소화효소(외분비)와 인슐린(내분비)을 만듭니다. 머리 · 몸통 · 꼬리로 나뉩니다."}, {"id": "duodenum", "ko": "샘창자", "en": "Duodenum", "layer": "organ", "note": "작은창자의 첫 부분(C자 모양). 이자머리를 감싸고 쓸개즙과 이자액이 합류합니다."}, {"id": "rectum", "ko": "곧창자", "en": "Rectum", "layer": "organ", "note": "큰창자의 끝부분. 엉치뼈 앞쪽을 따라 내려가 항문관으로 이어집니다."}, {"id": "colon", "ko": "큰창자", "en": "Large intestine", "layer": "organ", "note": "막창자(+막창자꼬리) · 잘록창자(오름·가로·내림·구불) · 곧창자. 겉면에 잘록창자주름이 보입니다."}, {"id": "small", "ko": "작은창자", "en": "Small intestine", "layer": "organ", "note": "샘창자 · 빈창자 · 돌창자로 이루어집니다(빈창자 2/5, 돌창자 3/5)."}, {"id": "diaphragm", "ko": "가로막", "en": "Diaphragm", "layer": "muscle", "note": "가로막신경(C3–5) 지배. 가장 중요한 호흡근. 대동맥열공(T12) · 식도열공(T10) · 대정맥공(T8)이 지납니다."}, {"id": "stomach", "ko": "위", "en": "Stomach", "layer": "organ", "note": "왼쪽 윗배. 들문 · 위바닥 · 위몸통 · 날문부로 나뉘며 큰굽이/작은굽이가 있습니다."}, {"id": "liver", "ko": "간", "en": "Liver", "layer": "organ", "note": "몸에서 가장 큰 샘. 오른엽 · 왼엽을 낫인대가 나눕니다. 오른쪽 윗배에 있습니다."}, {"id": "gallbladder", "ko": "쓸개", "en": "Gallbladder", "layer": "organ", "note": "간 아래면의 주머니. 쓸개즙을 저장하고 농축합니다."}, {"id": "lung_r", "ko": "오른허파", "en": "Right lung", "layer": "organ", "note": "오른쪽 3엽(위엽 · 중간엽 · 아래엽). 가로틈과 빗틈으로 나뉩니다."}, {"id": "lung_l", "ko": "왼허파", "en": "Left lung", "layer": "organ", "note": "왼쪽 2엽(위엽 · 아래엽). 앞모서리에 심장패임, 아래에 혀부분이 있습니다."}, {"id": "trachea", "ko": "기관", "en": "Trachea", "layer": "organ", "note": "목뼈 6번 높이에서 시작해 등뼈 4–5번 높이(복장뼈각)에서 두 기관지로 갈라집니다. C자 연골고리가 있습니다."}, {"id": "heart", "ko": "심장", "en": "Heart", "layer": "organ", "note": "심방 2 · 심실 2의 네 방. 가슴 안에서 약간 왼쪽에 놓이며 심장막에 싸여 있습니다."}, {"id": "larynx", "ko": "후두", "en": "Larynx", "layer": "organ", "note": "발성과 기도 보호를 맡는 기관. 갑상연골이 목의 후두융기를 이룹니다."}, {"id": "thyroid", "ko": "갑상샘", "en": "Thyroid gland", "layer": "organ", "note": "목 앞쪽의 나비 모양 샘. 두 엽이 갑상샘잘록으로 이어지며 갑상샘호르몬을 분비합니다."}, {"id": "bladder", "ko": "방광", "en": "Urinary bladder", "layer": "organ", "note": "오줌을 저장. 골반강 앞쪽, 두덩뼈 뒤에 있습니다."}, {"id": "pelvis", "ko": "볼기뼈", "en": "Hip bone (pelvis)", "layer": "bone", "note": "엉덩뼈 · 궁둥뼈 · 두덩뼈가 합쳐져 이루며, 좌우 두덩뼈가 두덩결합으로 만납니다."}, {"id": "ribs", "ko": "갈비뼈", "en": "Ribs (1–12)", "layer": "bone", "note": "12쌍: 참갈비뼈 7 · 거짓갈비뼈 3 · 뜬갈비뼈 2. 밝은 청회색 부분이 갈비연골입니다."}, {"id": "sternum", "ko": "복장뼈", "en": "Sternum", "layer": "bone", "note": "복장뼈자루 · 복장뼈몸통 · 칼돌기로 구성되며, 자루와 몸통 사이가 복장뼈각입니다."}, {"id": "clavicle", "ko": "빗장뼈", "en": "Clavicle", "layer": "bone", "note": "팔이음뼈를 몸통에 연결하는 유일한 뼈. 가운데 1/3에서 골절이 잦습니다."}, {"id": "transversus", "ko": "배가로근", "en": "Transversus abdominis", "layer": "muscle", "note": "아래 가슴신경 · 엉덩아랫배신경 지배. 배 속 압력을 높이는 가장 깊은 납작근. 섬유가 가로로 달립니다."}, {"id": "oblique_int", "ko": "배속빗근", "en": "Internal oblique", "layer": "muscle", "note": "아래 가슴신경 · 엉덩아랫배신경 지배. 몸통 굽힘과 같은쪽 돌림. 섬유는 배바깥빗근과 직각으로 달립니다."}, {"id": "rectus", "ko": "배곧은근", "en": "Rectus abdominis", "layer": "muscle", "note": "가슴신경(T7–T12) 지배. 몸통 굽힘. 힘줄 교차(보통 3개)가 있어 '식스팩'을 이룹니다. 배곧은근집에 싸입니다."}, {"id": "oblique_ext", "ko": "배바깥빗근", "en": "External oblique", "layer": "muscle", "note": "아래 가슴신경(T7–T12) 지배. 몸통 굽힘과 반대쪽 돌림. 섬유가 '주머니에 손 넣는' 방향(아래안쪽)으로 달립니다."}, {"id": "serratus", "ko": "앞톱니근", "en": "Serratus anterior", "layer": "muscle", "note": "긴가슴신경 지배. 어깨뼈를 앞으로 당기고 돌립니다. 손상 시 날개어깨뼈가 생깁니다."}, {"id": "pecminor", "ko": "작은가슴근", "en": "Pectoralis minor", "layer": "muscle", "note": "안쪽가슴근신경 지배. 어깨뼈를 앞아래로 당깁니다. 3–5번 갈비뼈에서 부리돌기로 이어집니다."}, {"id": "pec", "ko": "큰가슴근", "en": "Pectoralis major", "layer": "muscle", "note": "안쪽·가쪽 가슴근신경 지배. 팔의 굽힘 · 모음 · 안쪽돌림."}, {"id": "deltoid", "ko": "삼각근", "en": "Deltoid", "layer": "muscle", "note": "겨드랑신경 지배. 팔 가쪽 벌림의 주동근입니다."}];
const LN={bone:'뼈',muscle:'근육',organ:'장기'};const OFF=["muscle"];
const svg=document.getElementById('svg'),side=document.getElementById('side');
let sel=null,dim=true;OFF.forEach(L=>META.filter(m=>m.layer===L).forEach(m=>document.getElementById('p-'+m.id).classList.add('hide')));const ORDER=[...svg.querySelectorAll('.part')];
side.innerHTML=Object.keys(LN).map(L=>`<h2><label><input type="checkbox" ${OFF.includes(L)?'':'checked'} data-layer="${L}"> ${LN[L]} 전체 표시</label></h2>`+META.filter(m=>m.layer===L).map(m=>
 `<div class="item" data-id="${m.id}"><input type="checkbox" ${OFF.includes(L)?'':'checked'} data-v="${m.id}" title="표시"><span>${m.ko}</span></div>`).join('')).join('')
 +'<label class="opt"><input type="checkbox" id="dim" checked>선택 외 흐리게</label><div class="card" id="card"><span style="color:var(--text-2)">그림이나 목록에서 구조물을 선택하세요.</span></div>';
function select(id){
  sel=sel===id?null:id;
  document.querySelectorAll('.part').forEach(p=>p.classList.toggle('on',p.dataset.id===sel));
  document.querySelectorAll('.item').forEach(i=>i.classList.toggle('on',i.dataset.id===sel));
  svg.parentNode.classList.toggle('dimmer',dim&&!!sel);
  ORDER.forEach(p=>svg.appendChild(p));                       // 원래 겹침 순서로 복원
  if(sel)svg.appendChild(document.getElementById('p-'+sel)); // 선택한 부품은 맨 위로
  const m=META.find(x=>x.id===sel);
  document.getElementById('card').innerHTML=m?`<b>${m.ko}</b> <i>${m.en}</i><br><span style="color:var(--text-2)">${LN[m.layer]}</span><p style="margin-top:6px">${m.note}</p>`:'<span style="color:var(--text-2)">그림이나 목록에서 구조물을 선택하세요.</span>';
}
svg.addEventListener('click',e=>{const p=e.target.closest('.part');if(p)select(p.dataset.id);});
side.addEventListener('click',e=>{
  if(e.target.dataset.layer){const L=e.target.dataset.layer,on=e.target.checked;
    META.filter(m=>m.layer===L).forEach(m=>document.getElementById('p-'+m.id).classList.toggle('hide',!on));
    side.querySelectorAll(`.item input`).forEach(i=>{if(META.find(m=>m.id===i.dataset.v).layer===L)i.checked=on;});return;}
  if(e.target.dataset.v){document.getElementById('p-'+e.target.dataset.v).classList.toggle('hide',!e.target.checked);return;}
  const it=e.target.closest('.item');if(it&&e.target.tagName!=='INPUT')select(it.dataset.id);
});
document.getElementById('dim').onchange=e=>{dim=e.target.checked;svg.parentNode.classList.toggle('dimmer',dim&&!!sel);};
</script></body></html>
